*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit}
.w{max-width:540px;margin:0 auto;padding:14px 18px 48px}
.top{display:flex;align-items:center;gap:10px}
.date{flex:1;text-align:center;font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif}
.date b{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em}
.date small{color:var(--mu);font-size:14px}
.nb{width:46px;height:46px;border-radius:50%;border:1px solid var(--ln);background:none;font-size:24px;line-height:1}
.lnk{background:none;border:0;color:var(--ac);padding:2px 6px;font-size:14px}
.tabs{display:flex;gap:4px;margin:16px 0 12px;border-bottom:1px solid var(--ln)}
.tabs button{flex:1;padding:10px 0;background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);font-size:13px}
.tabs button.on{color:var(--tx);border-bottom-color:var(--ac);font-weight:600}
.lane{height:12px;border-radius:6px;background:var(--dim);overflow:hidden;margin:6px 0 2px}
.lane i{display:block;height:100%;border-radius:6px;background:repeating-linear-gradient(90deg,var(--ac) 0 12px,var(--ac2) 12px 16px);transition:width .3s}
.cnt{color:var(--mu);font-size:14px;margin:0 0 4px}
h2{font-size:15px;font-weight:600;color:var(--mu);margin:22px 0 2px}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:10px 0;background:none;border:0;border-top:1px solid var(--ln);text-align:left;cursor:pointer}
h2+.row,h2+.nop{border-top:0}
.box{width:30px;height:30px;border-radius:50%;border:2px solid var(--mu);flex:none;display:grid;place-items:center;color:var(--bg);font-size:17px;font-weight:700}
.done .box{background:var(--ac);border-color:var(--ac)}
.lb{flex:1}
.st{font-size:14px;color:var(--mu);white-space:nowrap}
.nop{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln);color:var(--mu)}
.nop .lb{color:var(--tx)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--tx);background:var(--dim);border:1px solid var(--ln);border-radius:10px;padding:10px 12px}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.nop input{flex:1}
.nt{margin:4px 0 12px}
.sm{padding:9px 14px;border-radius:10px;border:1px solid var(--ln);background:none;font-size:15px}
.dg{color:var(--dg);border-color:var(--dg)}
.mu{color:var(--mu);font-size:14px;margin:8px 0}
.wk .st{min-width:0;font-size:13px;text-align:right}
.g{display:block;color:var(--mu);font-size:14px;margin-top:2px}
.ex{font-weight:600;color:var(--tx)}
.hb{margin:14px 0}
.hl{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.big{font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:8px}
svg{display:block;margin:6px 0}
.fl{display:block;font-size:14px;color:var(--mu);margin:14px 0 4px}
.fd{font-family:inherit;font-size:16px;margin-top:4px}
.wk.sel{background:var(--dim);margin:0 -10px;width:calc(100% + 20px);padding:10px;border-radius:10px;border-top-color:transparent}
</style>
</head>

function p(n){return n<10?"0"+n:""+n}

function hb(lb,d,t,u){var p=t?Math.round(d*100/t):0;return '<div class="hb"><div class="hl"><span>'+lb+'</span><span class="st">'+(u?fx(d)+' su '+fx(t)+' ore':d+' su '+t)+', '+p+'%</span></div><div class="lane"><i style="width:'+p+'%"></i></div></div>'}
function bars(v,lab){var n=v.length,w=320,h=100,g=w/n,bw=Math.min(30,g-3),s='<svg viewBox="0 0 '+w+' '+(h+20)+'" width="100%" role="img" aria-label="Grafico a barre del completamento in percentuale"><line x1="0" x2="'+w+'" y1="'+h+'" y2="'+h+'" style="stroke:var(--ln)"/>';
v.forEach(function(x,i){var bx=i*g+(g-bw)/2,bh=x==null?2:Math.max(3,x*h/100);
s+='<rect x="'+bx+'" y="'+(h-bh)+'" width="'+bw+'" height="'+bh+'" rx="3" style="fill:'+(x==null?'var(--dim)':'var(--ac)')+'"/>';
if(lab[i])s+='<text x="'+(bx+bw/2)+'" y="'+(h+14)+'" text-anchor="middle" font-size="10" style="fill:var(--mu)">'+lab[i]+'</text>';
if(x!=null&&n<=8)s+='<text x="'+(bx+bw/2)+'" y="'+(h-bh-3)+'" text-anchor="middle" font-size="10" style="fill:var(--tx)">'+x+'</text>'});
return s+'</svg>'}

if(per==="mese"){var G={},O=[];ds.forEach(function(d){var q=new Date(d);q.setDate(q.getDate()-((q.getDay()+6)%7));var qk=k(q);if(!G[qk]){G[qk]=[];O.push([qk,q])}G[qk].push(d)});

h+='<h2>Ore di studio per materia</h2>';Object.keys(SN).forEach(function(c){var e=t.hr[SN[c]];if(e)h+=hb(SN[c],e[0],e[1],1)});
h+='<h2>Abitudini una per una</h2>';S.habits.forEach(function(x){var e=t.hb[x.id];if(e)h+=hb(esc(x.n),e[0],e[1])});
return h}

var L=[],t=now();for(var i=0;i<14;i++){var d=new Date(t);d.setDate(t.getDate()-i);var q=(S.days[k(d)]||{}).f;if(q&&FL.some(function(x){return q[x[0]]}))L.push([d,q])}

L.forEach(function(x){var s=FL.filter(function(y){return x[1][y[0]]}).map(function(y){return y[1]+': '+x[1][y[0]]}).join('; ');if(s.length>110)s=s.slice(0,108)+'…';h+='<button class="row" data-a="od" data-d="'+k(x[0])+'"><span class="lb"><b>'+DS[x[0].getDay()]+' '+x[0].getDate()+' '+MN[x[0].getMonth()]+'</b><span class="g">'+esc(s)+'</span></span></button>'});
return h}
function boot(){var c=window.claude,off="Dati salvati su questo telefono.";
if(!c||!c.use){setSt(off);return}
Promise.all([c.use("db"),c.use("user")]).then(function(a){var db=a[0],us=a[1];if(!db||!us){setSt(off);return}
return us.id().then(function(id){if(!id){setSt(off);return}

function render(){var isT=k(cur)===k(now());

else if(a==="td")cur=now();

else if(a==="rs"){if(armed){S=def();save();armed=false}else armed=true}
render()});
app.addEventListener("input",function(e){if(e.target.dataset.a==="n"){wr(k(cur)).note=e.target.value;save()}else if(e.target.dataset.f){var rr=wr(k(cur));rr.f=rr.f||{};rr.f[e.target.dataset.f]=e.target.value;save()}});
render();boot();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
})();
